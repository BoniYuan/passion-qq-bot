<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passion FAQ 管理</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand"><img src="/passion-logo.png" onerror="this.style.display='none'"><div><strong>Passion FAQ</strong><span>知识库管理</span></div></div><div class="auth"><input id="password" type="password" placeholder="管理密码"><button id="login">登录</button></div></header>
<main class="hidden" id="app"><aside><div class="aside-head"><div><b>知识条目</b><span id="count"></span></div><button id="new">＋ 新建</button></div><input id="search" placeholder="搜索标题或触发词"><div id="entries"></div></aside>
<section class="editor"><div class="editor-head"><div><span id="state" class="pill">草稿</span><span id="version"></span></div><div><button class="quiet" id="history">历史版本</button><button class="quiet" id="togglePublish">发布</button><button id="save">保存</button></div></div>
<div class="form"><label>知识 ID<input id="id" placeholder="例如 sillytavern_config"></label><label>标题<input id="title" placeholder="用户能理解的知识标题"></label><div class="two"><label>触发词（每行一个）<textarea id="triggers"></textarea></label><label>示例问法（每行一个）<textarea id="examples"></textarea></label></div><label>关键词组合（每行一组，组内用 + 分隔）<textarea id="groups" placeholder="酒馆 + 配置"></textarea></label><label>回复正文<textarea id="answer" class="answer" placeholder="输入机器人要发送的文字答案"></textarea></label>
<div class="media-head"><b>配套图片</b><label class="upload">上传图片<input id="upload" type="file" accept="image/*" multiple></label></div><div id="images" class="images"></div></div></section></main>
<dialog id="historyDialog"><div class="dialog-head"><b>历史版本</b><button id="closeHistory">×</button></div><div id="revisions"></div></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
